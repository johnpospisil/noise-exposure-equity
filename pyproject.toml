[project]
name = "ne"
version = "0.1.0"
description = "Loud and Unequal: transportation noise exposure, demographics and NYC noise complaints"
license = { text = "MIT" }
authors = [{ name = "John Pospisil" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # geospatial
    "rasterio",
    "rioxarray",
    "exactextract",
    "geopandas",
    "pyogrio",
    "shapely",
    "pyproj",
    # data
    "numpy",
    "pandas",
    "pyarrow",
    "duckdb",
    # models
    "statsmodels",
    "libpysal",
    "spreg",
    "esda",
    "scipy",
    # viz
    "matplotlib",
    "plotly",
    # plumbing
    "requests",
    "tenacity",
    "python-dotenv",
    "pyyaml",
    "tqdm",
    "python-calamine>=0.9.1",
]

[dependency-groups]
dev = ["pytest", "ruff", "ipykernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ne"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
